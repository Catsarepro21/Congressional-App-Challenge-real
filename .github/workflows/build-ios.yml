name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install JS Dependencies
        run: npm ci

      - name: Generate Native iOS Project
        run: npx expo prebuild --platform ios --clean

      - name: Configure Node path for Xcode scripts
        run: |
          NODE_PATH=$(command -v node)
          echo "NODE_BINARY=$NODE_PATH" >> $GITHUB_ENV
          echo "export NODE_BINARY=$NODE_PATH" > ios/.xcode.env.local
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "$NODE_PATH" /usr/local/bin/node

      - name: Patch Podfile for CI (disable code signing in all pod targets)
        run: |
          python3 << 'PYEOF'
          import re

          with open('ios/Podfile', 'r') as f:
              content = f.read()

          injection = """
            # CI: disable code signing and script sandboxing
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED']          = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED']         = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY']            = ''
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY']   = ''
                config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
              end
            end
          """

          if 'post_install do |installer|' in content:
              patched = re.sub(
                  r'(post_install do \|installer\|)',
                  r'\1' + injection,
                  content,
                  count=1
              )
          else:
              patched = content + "\npost_install do |installer|\n" + injection + "\nend\n"

          with open('ios/Podfile', 'w') as f:
              f.write(patched)

          print("Podfile patched successfully")
          PYEOF

      - name: Patch ExpoModulesJSI build script (add signing flags to inner xcodebuild)
        run: |
          SCRIPT="node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh"
          echo "--- Original xcodebuild call ---"
          grep -n "CODE_SIGNING\|env -i\|xcodebuild" "$SCRIPT" | head -20

          # The script uses:
          #   env -i PATH="$PATH" HOME="$HOME" PODS_ROOT="$PODS_ROOT" RN_ROOT="$RN_ROOT" \
          #     xcodebuild \
          #
          # We need to add CODE_SIGNING_ALLOWED=NO etc. to the env -i call.
          python3 << 'PYEOF'
          with open('node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh', 'r') as f:
              content = f.read()

          # Inject signing flags into the env -i ... xcodebuild call.
          # The pattern to find is the env -i line with RN_ROOT, followed by xcodebuild.
          old = 'env -i PATH="$PATH" HOME="$HOME" PODS_ROOT="$PODS_ROOT" RN_ROOT="$RN_ROOT" \\'
          new = (
              'env -i PATH="$PATH" HOME="$HOME" PODS_ROOT="$PODS_ROOT" RN_ROOT="$RN_ROOT" \\\n'
              '    CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \\'
          )

          if old in content:
              patched = content.replace(old, new, 1)
              with open('node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh', 'w') as f:
                  f.write(patched)
              print("SUCCESS: Patched env -i line in build-xcframework.sh")
          else:
              # Fallback: patch using a broader pattern that finds the xcodebuild build call
              import re
              patched = re.sub(
                  r'(env -i PATH="\$PATH" HOME="\$HOME"[^\n]+ \\)',
                  r'\1\n    CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \\',
                  content,
                  count=1
              )
              with open('node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh', 'w') as f:
                  f.write(patched)
              print("FALLBACK: Patched using regex")

          # Verify the patch
          with open('node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh', 'r') as f:
              verify = f.read()
          if 'CODE_SIGNING_ALLOWED=NO' in verify:
              print("Verification PASSED: CODE_SIGNING_ALLOWED=NO is in the script")
          else:
              print("WARNING: Patch may have failed, CODE_SIGNING_ALLOWED not found")
          PYEOF

          echo "--- Patched xcodebuild call ---"
          grep -n "CODE_SIGNING\|env -i\|xcodebuild" "$SCRIPT" | head -20

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build Unsigned App with Xcode
        env:
          NODE_BINARY: ${{ env.NODE_BINARY }}
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/SafeScaleHealth.xcworkspace \
            -scheme SafeScaleHealth \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            NODE_BINARY="$NODE_BINARY" \
            clean build 2>&1 | tee xcodebuild.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "====== ERRORS ======"
            grep -E "error:|Error:|BUILD FAILED|PhaseScriptExecution" xcodebuild.log | head -80
            exit $EXIT_CODE
          fi

      - name: Package App into IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products -type d -path "*Release-iphoneos*" -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found under build/Build/Products."
            ls -la build/Build/Products
            exit 1
          fi
          APP_NAME=$(basename "$APP_PATH" .app)
          IPA_NAME="${APP_NAME}.ipa"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload "$IPA_NAME"
          echo "IPA_PATH=\"$IPA_NAME\"" >> $GITHUB_ENV

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeScaleHealth-Unsigned-IPA
          path: ${{ env.IPA_PATH }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
