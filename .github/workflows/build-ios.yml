name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install JS Dependencies
        run: npm ci

      - name: Generate Native iOS Project
        run: npx expo prebuild --platform ios --clean

      - name: Configure Node path for Xcode scripts
        run: |
          NODE_PATH=$(command -v node)
          echo "NODE_BINARY=$NODE_PATH" >> $GITHUB_ENV
          echo "export NODE_BINARY=$NODE_PATH" > ios/.xcode.env.local
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "$NODE_PATH" /usr/local/bin/node

      - name: Patch Podfile to disable code signing in all Pod targets
        run: |
          python3 << 'PYEOF'
          import re

          with open('ios/Podfile', 'r') as f:
              content = f.read()

          # Settings to inject into the post_install hook
          injection = """
            # CI: disable code signing and script sandboxing for all pod targets
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED']          = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED']         = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY']            = ''
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY']   = ''
                config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
              end
            end
          """

          # Inject right after the first "post_install do |installer|" line
          patched = re.sub(
              r'(post_install do \|installer\|)',
              r'\1' + injection,
              content,
              count=1
          )

          # If there was no post_install block at all, append one
          if patched == content:
              patched += "\npost_install do |installer|\n" + injection + "\nend\n"

          with open('ios/Podfile', 'w') as f:
              f.write(patched)

          print("Podfile patched successfully")
          PYEOF

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build Unsigned App with Xcode
        env:
          NODE_BINARY: ${{ env.NODE_BINARY }}
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/SafeScaleHealth.xcworkspace \
            -scheme SafeScaleHealth \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            NODE_BINARY="$NODE_BINARY" \
            clean build 2>&1 | tee xcodebuild.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "--- XCODEBUILD ERRORS ---"
            grep -E "error:|Error:|BUILD FAILED" xcodebuild.log | head -80
            exit $EXIT_CODE
          fi

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/SafeScaleHealth.app Payload/
          zip -r SafeScaleHealth.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeScaleHealth-Unsigned-IPA
          path: SafeScaleHealth.ipa

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
