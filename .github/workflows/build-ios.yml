name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 60

    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      COCOAPODS_DISABLE_STATS: "true"
      EXPO_NO_DOTENV: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail

          if [[ -d /Applications/Xcode_26.4.app/Contents/Developer ]]; then
            XCODE_DEVELOPER=/Applications/Xcode_26.4.app/Contents/Developer
          elif [[ -d /Applications/Xcode_26.4.1.app/Contents/Developer ]]; then
            XCODE_DEVELOPER=/Applications/Xcode_26.4.1.app/Contents/Developer
          else
            echo "Required Xcode version not found."
            ls -1 /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi

          sudo xcode-select -s "$XCODE_DEVELOPER"
          xcodebuild -version
          pod --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: Patch react-native-health for React Native 0.85
        run: |
          set -euo pipefail

          HEALTH_FILE="node_modules/react-native-health/RCTAppleHealthKit/RCTAppleHealthKit.m"

          test -f "$HEALTH_FILE"

          if grep -q "setBridge:" "$HEALTH_FILE"; then
            sed -i.bak '/setBridge:/d' "$HEALTH_FILE"
          fi

          if grep -q "setBridge:" "$HEALTH_FILE"; then
            echo "The obsolete setBridge selector is still present." >&2
            exit 1
          fi

          echo "react-native-health compatibility patch applied."

      - run: npm run check:secrets
      - run: npm run typecheck
      - run: npm test

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Verify generated project
        run: |
          set -euo pipefail
          test -f ios/SafeScaleHealth.xcodeproj/project.pbxproj

      - name: Install pods
        working-directory: ios
        run: |
          set -euo pipefail
          printf 'export NODE_BINARY="%s"\n' "$(command -v node)" > .xcode.env.local
          pod install --repo-update
          test -f SafeScaleHealth.xcworkspace/contents.xcworkspacedata

      - name: Compile unsigned app
        run: |
          set -euo pipefail

          xcodebuild \
            -workspace ios/SafeScaleHealth.xcworkspace \
            -scheme SafeScaleHealth \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH=build/Build/Products/Release-iphoneos/SafeScaleHealth.app
          test -d "$APP_PATH"

          mkdir -p package/Payload
          ditto "$APP_PATH" package/Payload/SafeScaleHealth.app

          cd package
          zip -qry SafeScaleHealth-unsigned.ipa Payload

      - name: Publish direct IPA download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          IPA_PATH=package/SafeScaleHealth-unsigned.ipa
          test -s "$IPA_PATH"
          RELEASE_TAG="ios-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          gh release create "$RELEASE_TAG" "$IPA_PATH" \
            --target "$GITHUB_SHA" \
            --title "iOS unsigned build ${GITHUB_RUN_NUMBER} (attempt ${GITHUB_RUN_ATTEMPT})" \
            --notes "Unsigned iOS build. Download SafeScaleHealth-unsigned.ipa directly from Assets. Signing is still required before installation." \
            --prerelease \
            --latest=false

          DOWNLOAD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/SafeScaleHealth-unsigned.ipa"
          printf '### iOS download\n\n[Download SafeScaleHealth-unsigned.ipa](%s)\n\nUnsigned build; signing is required before installation.\n' "$DOWNLOAD_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: xcodebuild.log
          if-no-files-found: ignore
