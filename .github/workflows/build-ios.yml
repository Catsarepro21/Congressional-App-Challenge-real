name: Build Unsigned iOS IPA

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab on GitHub

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Symlink Node.js for Xcode
        run: |
          sudo ln -sf $(which node) /usr/local/bin/node

      - name: Generate Native iOS Project
        run: npx expo prebuild --platform ios

      - name: Configure Xcode Node environment
        run: |
          echo "export NODE_BINARY=$(command -v node)" > ios/.xcode.env.local

      - name: Build Unsigned App with Xcode
        run: |
          xcodebuild -workspace ios/SafeScaleHealth.xcworkspace \
                     -scheme SafeScaleHealth \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE="" \
                     ENABLE_USER_SCRIPT_SANDBOXING=NO \
                     clean build

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/SafeScaleHealth.app Payload/
          zip -r SafeScaleHealth.ipa Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeScaleHealth-Unsigned-IPA
          path: SafeScaleHealth.ipa
