name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      APK_PATH: ''

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install JS Dependencies
        run: npm ci

      - name: Setup Java for Android Build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: Build Unsigned Android APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease \
            -x lintVitalRelease \
            --no-daemon 2>&1 | tee gradle.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "====== GRADLE BUILD ERRORS ======"
            grep -E "error:|Error:|BUILD FAILED" gradle.log | head -80
            exit $EXIT_CODE
          fi

      - name: Locate Android APK
        run: |
          set -euo pipefail
          APK_PATH=$(find android/app/build/outputs/apk -type f -name "*.apk" -print -quit)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found."
            find android/app/build/outputs -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          APK_NAME=$(basename "$APK_PATH")
          cp "$APK_PATH" .
          printf '%s\n' "APK_PATH=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload Android APK Artifact
        if: env.APK_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: SafeScaleHealth-Unsigned-APK
          path: ${{ env.APK_PATH }}

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: android/gradle.log
